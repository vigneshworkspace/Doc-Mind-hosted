<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocMind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            primary: {
              'DEFAULT': '#fbbf24', // amber-400
              '50': '#fffbeb',
              '100': '#fef3c7',
              '200': '#fde68a',
              '300': '#fcd34d',
              '400': '#fbbf24',
              '500': '#f59e0b',
              '600': '#d97706',
              '700': '#b45309',
              '800': '#92400e',
              '900': '#78350f',
              '950': '#451a03'
            },
            secondary: {
                'DEFAULT': '#5B4636', // user's dark brown
                '500': '#5B4636',
            },
            'light-bg': '#EDE0D6', // user's light beige
            'light-surface': 'rgba(255, 255, 255, 0.4)',
            'light-border': 'rgba(91, 70, 54, 0.1)',
            'dark-text': '#443529', // A darker brown for better text contrast
            'muted-text': '#8E7E70', // Muted brown
            
            'dark-bg': '#121212', // Material Design dark background
            'dark-surface': 'rgba(255, 255, 255, 0.08)', // Subtle white glass
            'dark-border': 'rgba(255, 255, 255, 0.15)',
            'light-text': '#F3F4F6', // Off-white for readability
            'dark-muted-text': '#9CA3AF', // Muted gray
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer base {
      body {
        @apply bg-light-bg text-dark-text font-sans overflow-hidden dark:bg-dark-bg dark:text-light-text;
      }
      .glass-card {
        @apply bg-light-surface border border-light-border backdrop-blur-lg shadow-2xl shadow-black/5 dark:bg-dark-surface dark:border-dark-border;
      }
    }
    @layer utilities {
      .animate-fadeIn {
        animation: fadeIn 0.7s ease-in-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      .transform-rotate-y-180 {
        transform: rotateY(180deg);
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }

      /* Hide scrollbar for IE, Edge and Firefox */
      .hide-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      
      /* Responsive Table styles */
      @media (max-width: 767px) {
        .mobile-table thead {
          @apply hidden;
        }
        .mobile-table tr {
          @apply block mb-4 rounded-xl p-4 border border-light-border dark:border-dark-border;
        }
        .mobile-table td {
          @apply block text-right border-b border-light-border/50 dark:border-dark-border/50 py-2 px-1;
        }
        .mobile-table td:last-child {
           @apply border-b-0;
        }
        .mobile-table td::before {
          content: attr(data-label);
          @apply float-left font-bold text-dark-text dark:text-light-text;
        }
        .mobile-table td:first-child {
            @apply pt-0;
        }
      }
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.1.0/",
    "react": "https://esm.sh/react@^19.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "@google/genai": "https://esm.sh/@google/genai@^1.11.0",
    "pdfjs-dist": "https://unpkg.com/pdfjs-dist@4.4.168/build/pdf.mjs",
    "lucide-react": "https://esm.sh/lucide-react@^0.525.0",
    "pdfjs-dist/": "https://esm.sh/pdfjs-dist@^5.4.54/"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

</head>
