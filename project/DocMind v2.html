<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>DocMind — Minimal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&display=swap" />
  <link rel="stylesheet" href="styles-minimal.css" />
  <style>
    /* Only structural/neutral vars are locked here.
       Tweakable vars (accent, font, paper, ink) are NOT !important
       so app.jsx setProperty("important") calls can override them. */
    :root {
      --ink-2:         oklch(38% 0.012 260);
      --ink-3:         oklch(56% 0.012 260);
      --ink-4:         oklch(72% 0.008 260);
      --hairline:      oklch(93% 0.005 260);
      --hairline-2:    oklch(96% 0.004 260);
    }
    body.is-dark {
      --paper:         oklch(18% 0.012 260) !important;
      --paper-2:       oklch(22% 0.014 260) !important;
      --card:          oklch(22% 0.014 260) !important;
      --ink:           oklch(96% 0.005 260) !important;
      --ink-2:         oklch(82% 0.008 260) !important;
      --ink-3:         oklch(64% 0.012 260) !important;
      --ink-4:         oklch(48% 0.014 260) !important;
      --hairline:      oklch(30% 0.014 260) !important;
      --hairline-2:    oklch(26% 0.014 260) !important;
    }
    @keyframes dotbounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-4px); opacity: 1; }
    }
    @keyframes pomslide {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: none; }
    }
  </style>
</head>
<body style="font-family: 'Inter Tight', sans-serif">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <script type="text/babel" data-presets="env,react" src="tweaks-panel.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="fox.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="shell.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="auth.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="screens-core.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="screens-learn.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="screens-visual.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="screens-misc.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="screens-voice.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="app.jsx"></script>
</body>
</html>
